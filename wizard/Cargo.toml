[package]
name = "gryphgen-wizard"
version = "0.1.0"
edition = "2021"
description = "Interactive TUI wizard for the GRYPHGEN AI code generation platform"

[[bin]]
name = "gg-wizard"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
color-eyre = "0.6"
ureq = { version = "2.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tui-input = "0.10"
